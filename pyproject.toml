[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversemed-gen"
version = "0.2.0"
description = "LLM-assisted generator for adversarial medical multiple-choice questions where the correct behavior is abstention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Dyuthi Vallamsetty", email = "28dyuthiv@students.harker.org" },
]
maintainers = [
  { name = "Dyuthi Vallamsetty", email = "28dyuthiv@students.harker.org" },
]
keywords = [
  "medical LLM",
  "benchmark",
  "calibration",
  "false premise",
  "clinical safety",
  "hallucination",
  "abstention",
  "adversarial",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "build>=1.0",
  "twine>=5",
]

[project.urls]
Homepage      = "https://github.com/calnugget/adversemed-500"
Repository    = "https://github.com/calnugget/adversemed-500"
"Bug Tracker" = "https://github.com/calnugget/adversemed-500/issues"
"OSF Project" = "https://osf.io/mehu4"
# Concept DOI: always resolves to the newest archived version. 0.1.x pointed at the
# v1.0.0 version DOI (21961771), which contains no inference outputs.
Dataset       = "https://doi.org/10.5281/zenodo.21961770"

[project.scripts]
adversemed-gen = "adversemed_gen.cli:main"

[tool.setuptools]
# The importable Python package is `adversemed_gen/` at the repo root, matching the
# `adversemed-gen` distribution name. Through 0.1.1 this directory was called `generator`,
# so the wheel installed a top-level module of that dangerously generic name while
# `import adversemed_gen` raised ModuleNotFoundError.
packages = ["adversemed_gen"]
include-package-data = true

[tool.setuptools.package-data]
adversemed_gen = ["prompts/*.md"]
