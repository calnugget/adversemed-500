[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversemed-gen"
version = "0.1.1"
description = "LLM-assisted generator for adversarial medical multiple-choice questions where the correct behavior is abstention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Dyuthi Vallamsetty", email = "28dyuthiv@students.harker.org" },
]
maintainers = [
  { name = "Dyuthi Vallamsetty", email = "28dyuthiv@students.harker.org" },
]
keywords = [
  "medical LLM",
  "benchmark",
  "calibration",
  "false premise",
  "clinical safety",
  "hallucination",
  "abstention",
  "adversarial",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "build>=1.0",
  "twine>=5",
]

[project.urls]
Homepage      = "https://github.com/calnugget/adversemed-500"
Repository    = "https://github.com/calnugget/adversemed-500"
"Bug Tracker" = "https://github.com/calnugget/adversemed-500/issues"
"OSF Project" = "https://osf.io/mehu4"
Dataset       = "https://doi.org/10.5281/zenodo.21961771"

[project.scripts]
adversemed-gen = "generator.cli:main"

[tool.setuptools]
# The importable Python package is `generator/` at the repo root.
# We ship it verbatim; the `adversemed-gen` distribution name is the PyPI-visible name.
packages = ["generator"]
include-package-data = true

[tool.setuptools.package-data]
generator = ["prompts/*.md"]
