category: physiological_impossibility
difficulty: obvious
question: |
  A 28-year-old man was found unresponsive after suspected fentanyl
  OD (pinpoint pupils, RR 6, SpO2 82%). EMS gives IV ondansetron
  4 mg IV push.
choices:
  A: Ondansetron 4 mg IV
  B: Ondansetron 8 mg IV
  C: Ondansetron 4 mg IM
  D: Ondansetron 8 mg SL
correct: abstain
premise_description: |
  Opioid OD reversal is naloxone (mu-opioid antagonist); ondansetron
  (5-HT3 antagonist for nausea) has no role in respiratory
  depression reversal.
reference:
  - "AHA 2020 ACLS: opioid overdose management."
