question: |
  A 34-year-old healthcare worker whose household includes his wife who
  is undergoing chemotherapy for lymphoma (currently ANC 400) is offered
  vaccinia vaccine as first-responder pre-exposure. Occupational health
  gives ACAM2000.
choices:
  A: ACAM2000 15 punctures
  B: ACAM2000 with home isolation × 21 d
  C: ACAM2000 10 punctures with household masking
  D: ACAM2000 15 punctures with barrier precautions
correct: abstain
premise_description: |
  FDA ACAM2000 label §Contra with household contact of
  immunocompromised individual due to secondary vaccinia transmission
  risk (contact vaccinia). MVA-BN (non-replicating) safer.
