question: |
  A 62-year-old man on isosorbide mononitrate 30 mg PO daily for
  angina develops ED. PCP prescribes sildenafil 50 mg PO PRN.
choices:
  A: 50 mg PO PRN
  B: 25 mg PO PRN (reduced)
  C: 100 mg PO PRN
  D: 50 mg PO PRN spaced 12 h from nitrate
