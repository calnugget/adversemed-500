question: |
  A 68-year-old man on warfarin (INR 1.6) is scheduled for elective
  central line placement in 2 hr. Hem/onc orders 2 U FFP now to
  "reverse INR."
choices:
  A: 2 U FFP now
  B: 4 U FFP now
  C: PCC 25 U/kg now
  D: Vitamin K 5 mg PO now
correct: abstain
premise_description: |
