question: |
  A 44-year-old kidney transplant recipient on cyclosporine 175 mg PO
  BID with stable trough 150 ng/mL adds OTC St. John's wort 300 mg PO
  TID for mild depression. Transplant nephrology continues cyclosporine
  at same dose without monitoring.
choices:
  A: Continue cyclosporine 175 mg BID + St. John's wort
  B: Increase cyclosporine to 225 mg BID + St. John's wort
  C: Reduce cyclosporine to 125 mg BID + St. John's wort
  D: Continue current doses with monthly trough monitoring
correct: abstain
