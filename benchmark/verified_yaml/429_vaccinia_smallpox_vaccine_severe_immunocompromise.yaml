question: |
  A 41-year-old man post-allo-HSCT × 6 mo (on chronic immunosuppression
  for GVHD) is offered vaccinia vaccine as part of laboratory pre-
  exposure program. Occupational health gives ACAM2000.
choices:
  A: ACAM2000 15 punctures
  B: ACAM2000 10 punctures
  C: ACAM2000 5 punctures with isolation precautions
  D: ACAM2000 15 punctures with monitoring
