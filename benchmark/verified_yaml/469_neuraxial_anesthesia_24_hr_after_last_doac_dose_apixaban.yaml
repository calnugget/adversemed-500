category: impossible_timing
difficulty: subtle
question: |
  A 71-year-old man on apixaban 5 mg PO BID for AF is scheduled for
  urgent orthopedic surgery for femur fracture. Last apixaban dose was
  12 hr ago. Anesthesia plans spinal anesthesia now.
choices:
  A: Spinal anesthesia now
  B: Spinal anesthesia after andexanet reversal
  C: Spinal anesthesia after PCC 25 U/kg
  D: Spinal anesthesia after 18 hr from last apixaban dose
correct: abstain
premise_description: |
  ASRA (American Society of Regional Anesthesia) guidelines:
  neuraxial anesthesia contraindicated within 72 hr of last apixaban
  dose (48 hr for low-bleeding-risk procedures with normal renal
  function) due to spinal epidural hematoma risk.
reference:
  - "ASRA 2025 antithrombotic guideline — high-dose apixaban discontinued at least 72 hours before neuraxial block; reversal agents not routine for neuraxial procedures."
